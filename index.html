<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e3e6eb;
    --text: #15181d;
    --text-2: #5b6370;
    --text-3: #8a919c;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --accent-text: #ffffff;
    --danger: #dc2626;
    --high: #dc2626;
    --med: #d97706;
    --low: #059669;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1013; --surface: #171a1f; --surface-2: #1e2228; --border: #2a2f37;
      --text: #eceef1; --text-2: #a3aab5; --text-3: #6f7782;
      --accent: #818cf8; --accent-soft: #23264a; --accent-text: #0e1013;
      --danger: #f87171; --high: #f87171; --med: #fbbf24; --low: #34d399;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1013; --surface: #171a1f; --surface-2: #1e2228; --border: #2a2f37;
    --text: #eceef1; --text-2: #a3aab5; --text-3: #6f7782;
    --accent: #818cf8; --accent-soft: #23264a; --accent-text: #0e1013;
    --danger: #f87171; --high: #f87171; --med: #fbbf24; --low: #34d399;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 48px 16px 64px;
    -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  .app { max-width: 640px; margin: 0 auto; }

  /* Header */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .date { font-size: 13px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    transition: border-color .15s, color .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text-3); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Progress */
  .progress-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .progress-label { font-size: 14px; color: var(--text-2); }
  .progress-label strong { color: var(--text); font-weight: 600; }
  .progress-pct { font-size: 14px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s cubic-bezier(.2,.8,.2,1); }

  /* Add form */
  .add {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 6px; margin-bottom: 20px;
    transition: border-color .15s, box-shadow .15s;
  }
  .add:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
  .add-row { display: flex; align-items: center; gap: 8px; }
  .add input[type="text"] {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 15px; padding: 12px 12px;
  }
  .add input::placeholder { color: var(--text-3); }
  .add-btn {
    background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 14px;
    padding: 10px 18px; border-radius: 10px; white-space: nowrap; transition: opacity .15s, transform .1s;
  }
  .add-btn:hover { opacity: .9; }
  .add-btn:active { transform: scale(.97); }
  .add-meta { display: flex; gap: 8px; padding: 4px 6px 6px; flex-wrap: wrap; }
  .chip-input {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2);
    background: var(--surface-2); border: 1px solid transparent; border-radius: 8px; padding: 5px 10px;
  }
  .chip-input:focus-within { border-color: var(--border); }
  .chip-input svg { width: 14px; height: 14px; flex-shrink: 0; }
  .chip-input select, .chip-input input {
    border: none; outline: none; background: transparent; font-size: 13px; color: var(--text-2);
  }
  .chip-input input[type="date"] { width: 124px; }
  .chip-input select option { background: var(--surface); color: var(--text); }

  /* Toolbar */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .tab {
    font-size: 13px; font-weight: 500; color: var(--text-2); padding: 6px 14px; border-radius: 8px;
    transition: background .15s, color .15s;
  }
  .tab .count { color: var(--text-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .search {
    display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 10px; height: 36px; flex: 1; max-width: 220px; min-width: 140px;
  }
  .search:focus-within { border-color: var(--accent); }
  .search svg { width: 15px; height: 15px; color: var(--text-3); flex-shrink: 0; }
  .search input { border: none; outline: none; background: transparent; font-size: 13px; width: 100%; }

  /* List */
  .list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 12px 12px 14px;
    transition: border-color .15s, box-shadow .15s, opacity .2s, transform .2s;
    animation: in .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .item:hover { border-color: var(--text-3); }
  .item.dragging { opacity: .4; }
  .item.drag-over { box-shadow: 0 -2px 0 0 var(--accent); }
  .item.removing { opacity: 0; transform: translateX(16px); }

  .handle { color: var(--text-3); cursor: grab; opacity: 0; transition: opacity .15s; display: grid; place-items: center; margin-left: -6px; }
  .handle svg { width: 14px; height: 14px; }
  .item:hover .handle { opacity: 1; }

  .check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0;
    display: grid; place-items: center; transition: background .15s, border-color .15s;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { width: 12px; height: 12px; color: var(--accent-text); opacity: 0; transform: scale(.5); transition: opacity .15s, transform .2s cubic-bezier(.3,1.6,.5,1); }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check svg { opacity: 1; transform: scale(1); }

  .body { flex: 1; min-width: 0; }
  .title { font-size: 15px; line-height: 1.4; word-break: break-word; cursor: text; transition: color .15s; }
  .item.done .title { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
  .edit-input {
    width: 100%; font-size: 15px; border: none; outline: none; background: var(--surface-2);
    border-radius: 6px; padding: 2px 6px; margin: -2px -6px;
  }
  .meta { display: flex; gap: 10px; margin-top: 4px; font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
  .meta:empty { display: none; }
  .tag { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.high { background: var(--high); } .dot.medium { background: var(--med); } .dot.low { background: var(--low); }
  .tag.overdue { color: var(--danger); font-weight: 500; }
  .tag svg { width: 12px; height: 12px; }

  .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .item:hover .actions, .item:focus-within .actions { opacity: 1; }
  .act { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--text-3); transition: background .15s, color .15s; }
  .act:hover { background: var(--surface-2); color: var(--text); }
  .act.del:hover { color: var(--danger); }
  .act svg { width: 15px; height: 15px; }

  /* Empty */
  .empty { text-align: center; padding: 48px 16px; color: var(--text-3); }
  .empty svg { width: 44px; height: 44px; margin-bottom: 12px; color: var(--border); }
  .empty h3 { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
  .empty p { font-size: 13px; }

  /* Footer */
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 13px; color: var(--text-3); }
  .link-btn { font-size: 13px; color: var(--text-3); transition: color .15s; }
  .link-btn:hover { color: var(--danger); }
  .link-btn:disabled { opacity: .4; pointer-events: none; }
  .hint { text-align: center; margin-top: 32px; font-size: 12px; color: var(--text-3); }
  kbd { font-family: inherit; font-size: 11px; background: var(--surface); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120px);
    background: var(--text); color: var(--bg); font-size: 14px; border-radius: 12px;
    padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.2,.8,.2,1); z-index: 10;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast button { color: var(--accent); font-weight: 600; font-size: 13px; padding: 6px 10px; border-radius: 8px; }
  :root:not([data-theme="dark"]) .toast button { color: #a5b4fc; }

  @media (max-width: 520px) {
    body { padding-top: 28px; }
    h1 { font-size: 26px; }
    .search { max-width: none; flex-basis: 100%; }
    .actions, .handle { opacity: 1; }
    .handle { display: none; }
  }
  @media (hover: none) { .actions { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="date" id="today"></div>
      <h1 id="greeting">Tasks</h1>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <section class="progress-card" aria-label="Progress">
    <div class="progress-top">
      <span class="progress-label" id="progressLabel"></span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <div class="add-row">
      <label for="newTask" class="sr-only">New task</label>
      <input type="text" id="newTask" placeholder="What needs to be done?" maxlength="200">
      <button type="submit" class="add-btn">Add task</button>
    </div>
    <div class="add-meta">
      <label class="chip-input" title="Priority">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></svg>
        <select id="newPriority" aria-label="Priority">
          <option value="">No priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </label>
      <label class="chip-input" title="Due date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <input type="date" id="newDue" aria-label="Due date">
      </label>
    </div>
  </form>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Filter tasks">
      <button class="tab" role="tab" data-filter="all" aria-selected="true">All<span class="count" id="cAll">0</span></button>
      <button class="tab" role="tab" data-filter="active" aria-selected="false">Active<span class="count" id="cActive">0</span></button>
      <button class="tab" role="tab" data-filter="done" aria-selected="false">Done<span class="count" id="cDone">0</span></button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks">
    </label>
  </div>

  <ul class="list" id="list" aria-live="polite"></ul>

  <div class="footer" id="footer">
    <span id="remaining"></span>
    <button class="link-btn" id="clearDone">Clear completed</button>
  </div>

  <p class="hint">Press <kbd>/</kbd> to add a task · double-click a task to edit · drag to reorder</p>
</div>

<div class="toast" id="toast" role="status">
  <span id="toastMsg"></span>
  <button id="undoBtn">Undo</button>
</div>

<script>
(() => {
  const STORE_KEY = 'tasks.v1';
  const THEME_KEY = 'tasks.theme';
  const $ = (s) => document.querySelector(s);

  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let tasks = store.get(STORE_KEY, null);
  if (!Array.isArray(tasks)) {
    const d = new Date(); d.setDate(d.getDate() + 2);
    tasks = [
      { id: uid(), title: 'Welcome! Click the circle to complete a task', done: false, priority: 'medium', due: '' },
      { id: uid(), title: 'Double-click any task to edit it', done: false, priority: 'low', due: toISO(d) },
      { id: uid(), title: 'Drag tasks to reorder them', done: true, priority: '', due: '' }
    ];
  }
  let filter = 'all';
  let query = '';
  let lastDeleted = null;
  let toastTimer = null;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function save() { store.set(STORE_KEY, tasks); }
  function esc(s) { const el = document.createElement('div'); el.textContent = s; return el.innerHTML; }

  // Header
  const now = new Date();
  $('#today').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  const h = now.getHours();
  $('#greeting').textContent = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';

  // Theme
  const savedTheme = store.get(THEME_KEY, null);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $('#themeBtn').addEventListener('click', () => {
    const isDark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set(THEME_KEY, next);
  });

  function formatDue(due) {
    if (!due) return null;
    const today = toISO(new Date());
    const t = new Date(); t.setDate(t.getDate() + 1);
    const tomorrow = toISO(t);
    const label = due === today ? 'Today' : due === tomorrow ? 'Tomorrow'
      : new Date(due + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return { label, overdue: due < today };
  }

  const icons = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>'
  };

  function render() {
    const list = $('#list');
    const q = query.trim().toLowerCase();
    const visible = tasks.filter(t =>
      (filter === 'all' || (filter === 'done' ? t.done : !t.done)) &&
      (!q || t.title.toLowerCase().includes(q))
    );

    if (!visible.length) {
      const msg = q ? ['No matches', 'Try a different search term.']
        : filter === 'done' ? ['Nothing completed yet', 'Finished tasks will show up here.']
        : filter === 'active' && tasks.length ? ['All caught up', 'Every task is done. Nice work.']
        : ['No tasks yet', 'Add your first task above to get started.'];
      list.innerHTML = `<li class="empty">${icons.empty}<h3>${msg[0]}</h3><p>${msg[1]}</p></li>`;
    } else {
      list.innerHTML = visible.map(t => {
        const due = formatDue(t.due);
        const meta = [
          t.priority ? `<span class="tag"><span class="dot ${t.priority}"></span>${t.priority[0].toUpperCase() + t.priority.slice(1)}</span>` : '',
          due ? `<span class="tag ${due.overdue && !t.done ? 'overdue' : ''}">${icons.cal}${due.overdue && !t.done ? 'Overdue · ' : ''}${due.label}</span>` : ''
        ].join('');
        return `<li class="item ${t.done ? 'done' : ''}" data-id="${t.id}" draggable="true">
          <span class="handle" aria-hidden="true">${icons.grip}</span>
          <button class="check" data-act="toggle" aria-label="${t.done ? 'Mark as not done' : 'Mark as done'}">${icons.check}</button>
          <div class="body">
            <div class="title" data-act="edit-dbl">${esc(t.title)}</div>
            <div class="meta">${meta}</div>
          </div>
          <div class="actions">
            <button class="act" data-act="edit" aria-label="Edit task">${icons.edit}</button>
            <button class="act del" data-act="delete" aria-label="Delete task">${icons.del}</button>
          </div>
        </li>`;
      }).join('');
    }

    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const active = total - done;
    const pct = total ? Math.round((done / total) * 100) : 0;
    $('#cAll').textContent = total;
    $('#cActive').textContent = active;
    $('#cDone').textContent = done;
    $('#barFill').style.width = pct + '%';
    $('#progressPct').textContent = pct + '%';
    $('#progressLabel').innerHTML = total ? `<strong>${done}</strong> of ${total} tasks completed` : 'No tasks yet';
    $('#remaining').textContent = active === 1 ? '1 task left' : `${active} tasks left`;
    $('#clearDone').disabled = done === 0;
    $('#footer').style.display = total ? '' : 'none';
  }

  // Add
  $('#addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#newTask');
    const title = input.value.trim();
    if (!title) { input.focus(); return; }
    tasks.unshift({ id: uid(), title, done: false, priority: $('#newPriority').value, due: $('#newDue').value });
    input.value = ''; $('#newPriority').value = ''; $('#newDue').value = '';
    if (filter === 'done') setFilter('all');
    save(); render(); input.focus();
  });

  // Item actions
  $('#list').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    const li = e.target.closest('.item');
    if (!btn || !li) return;
    const t = tasks.find(x => x.id === li.dataset.id);
    if (!t) return;
    if (btn.dataset.act === 'toggle') { t.done = !t.done; save(); render(); }
    else if (btn.dataset.act === 'edit') startEdit(li, t);
    else if (btn.dataset.act === 'delete') removeTask(li, t);
  });
  $('#list').addEventListener('dblclick', (e) => {
    const title = e.target.closest('.title');
    const li = e.target.closest('.item');
    if (title && li) startEdit(li, tasks.find(x => x.id === li.dataset.id));
  });

  function startEdit(li, t) {
    const titleEl = li.querySelector('.title');
    if (!titleEl || li.querySelector('.edit-input')) return;
    const input = document.createElement('input');
    input.className = 'edit-input'; input.value = t.title; input.maxLength = 200;
    titleEl.replaceWith(input);
    li.draggable = false;
    input.focus(); input.select();
    let finished = false;
    const finish = (commit) => {
      if (finished) return; finished = true;
      const v = input.value.trim();
      if (commit && v) { t.title = v; save(); }
      render();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  function removeTask(li, t) {
    const index = tasks.indexOf(t);
    li.classList.add('removing');
    setTimeout(() => {
      tasks.splice(index, 1);
      lastDeleted = { items: [{ task: t, index }] };
      save(); render(); showToast('Task deleted');
    }, 180);
  }

  $('#clearDone').addEventListener('click', () => {
    const removed = [];
    tasks.forEach((t, i) => { if (t.done) removed.push({ task: t, index: i }); });
    if (!removed.length) return;
    tasks = tasks.filter(t => !t.done);
    lastDeleted = { items: removed };
    save(); render();
    showToast(removed.length === 1 ? '1 task cleared' : `${removed.length} tasks cleared`);
  });

  function showToast(msg) {
    $('#toastMsg').textContent = msg;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4500);
  }
  $('#undoBtn').addEventListener('click', () => {
    if (!lastDeleted) return;
    lastDeleted.items.sort((a, b) => a.index - b.index)
      .forEach(({ task, index }) => tasks.splice(Math.min(index, tasks.length), 0, task));
    lastDeleted = null;
    save(); render();
    $('#toast').classList.remove('show');
  });

  // Filters & search
  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.filter === f)));
    render();
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.filter)));
  $('#search').addEventListener('input', (e) => { query = e.target.value; render(); });

  // Drag to reorder
  let dragId = null;
  const list = $('#list');
  list.addEventListener('dragstart', (e) => {
    const li = e.target.closest('.item'); if (!li) return;
    dragId = li.dataset.id; li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch {}
  });
  list.addEventListener('dragend', () => {
    dragId = null;
    list.querySelectorAll('.dragging, .drag-over').forEach(el => el.classList.remove('dragging', 'drag-over'));
  });
  list.addEventListener('dragover', (e) => {
    const li = e.target.closest('.item'); if (!li || !dragId) return;
    e.preventDefault();
    list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (li.dataset.id !== dragId) li.classList.add('drag-over');
  });
  list.addEventListener('drop', (e) => {
    const li = e.target.closest('.item'); if (!li || !dragId) return;
    e.preventDefault();
    const from = tasks.findIndex(t => t.id === dragId);
    const [moved] = tasks.splice(from, 1);
    const to = tasks.findIndex(t => t.id === li.dataset.id);
    tasks.splice(to, 0, moved);
    save(); render();
  });

  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') {
      e.preventDefault(); $('#newTask').focus();
    }
  });

  render();
})();
</script>
</body>
</html>
